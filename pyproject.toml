[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "optmodels"
version = "0.1.0"
description = "Mathematical optimization, operations research, decision modelling, sensitivity analysis, and numerical verification."
readme = "README.md"
license = { text = "MIT" }
authors = [
  { name = "Dr. Pavanam Thomas", email = "thomaspavanam@gmail.com" },
]
requires-python = ">=3.11"
dependencies = [
  "numpy",
  "scipy",
  "matplotlib",
  "pulp",
]
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Intended Audience :: Education",
  "Topic :: Scientific/Engineering :: Mathematics",
  "Topic :: Scientific/Engineering",
]

[project.optional-dependencies]
dev = ["pytest"]

[project.urls]
Homepage = "https://github.com/pavanamthomas/optimization-decision-models"
Related-Lean4 = "https://github.com/pavanamthomas/lean4-optimization-economics"
Related-Finance = "https://github.com/pavanamthomas/quantitative-finance-models"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
